# Local dev database (Docker). Prod uses Neon via Vercel env — no code change, env swap only.
# Usage: docker compose up -d db  →  drizzle-kit migrate  →  pnpm dev
services:
  db:
    image: postgres:16-alpine
    container_name: maison-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: maison
      POSTGRES_PASSWORD: maison
      POSTGRES_DB: maison
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maison-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maison -d maison"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  maison-pgdata:
